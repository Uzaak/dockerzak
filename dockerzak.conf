# /etc/ssh/sshd_config.d/dockerzak.conf
# DockerZak SSH hardening — drop-in for openssh-server.
# Loaded via "Include /etc/ssh/sshd_config.d/*.conf" in sshd_config.

PasswordAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
AuthorizedKeysFile .ssh/authorized_keys
ChallengeResponseAuthentication no

# Additional hardening
X11Forwarding no
AllowTcpForwarding no
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 30

# Restrict SSH access to the dev user only
# Prevents any other account (if somehow created) from logging in via SSH
AllowUsers dev

# Clean up dead/disconnected sessions
# After 3 missed keepalive pings (3 * 60s = 180s), the session is dropped
ClientAliveInterval 60
ClientAliveCountMax 3

# Limit unauthenticated connection queue to reduce brute-force surface
# Format: start:rate:full (start dropping at 5, 50% chance until 10 max)
MaxStartups 5:50:10
