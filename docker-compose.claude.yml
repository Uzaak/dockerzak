# Optional override — share Claude Code auth and state from the host.
# Used automatically by `make up CLAUDE_DIR=~/.claude`.
# Do not use directly; the Makefile sets CLAUDE_DIR and CLAUDE_JSON.
#
# Three mounts are needed:
#   1. ~/.claude.json      — numStartups and other state that suppresses first-run setup
#   2. ~/.claude           — credentials, settings, plugins, session history
#   3. ~/.claude at its original host path — plugin installPaths in
#      installed_plugins.json are stored as absolute host paths; this
#      second alias makes them resolve correctly inside the container.
services:
  dockerzak:
    volumes:
      - "${CLAUDE_JSON}:/home/dev/.claude.json"
      - "${CLAUDE_DIR}:/home/dev/.claude"
      - "${CLAUDE_DIR}:${CLAUDE_DIR}"
    environment:
      # Pass OAuth token or API key from the host environment.
      # On macOS the token lives in Keychain and cannot be file-mounted;
      # set CLAUDE_CODE_OAUTH_TOKEN in your shell profile:
      #   export CLAUDE_CODE_OAUTH_TOKEN=$(security find-generic-password \
      #     -s "Claude Code-credentials" -w | python3 -c \
      #     "import sys,json; d=json.load(sys.stdin); \
      #      print(d.get('claudeAiOauth',{}).get('accessToken',''))")
      # On Linux set ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN in your shell.
      # Unset variables are silently ignored by Docker Compose.
      - CLAUDE_CODE_OAUTH_TOKEN
      - ANTHROPIC_API_KEY
